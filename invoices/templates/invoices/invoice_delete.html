
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Invoice</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-xl mx-auto px-4 py-20">

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">

            <div class="mb-5">
                <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                    !
                </div>
            </div>

            <h1 class="text-2xl font-bold text-gray-800">
                Delete Invoice?
            </h1>

            <p class="text-gray-500 mt-3">
                Are you sure you want to delete this invoice?
                This action cannot be undone.
            </p>

            <div class="bg-gray-50 rounded-lg p-4 mt-6 text-left">
                <p class="text-sm text-gray-500">Invoice Number</p>
                <p class="font-semibold text-gray-800">
                    {{ invoice.invoice_number }}
                </p>

                <p class="text-sm text-gray-500 mt-3">Customer</p>
                <p class="font-semibold text-gray-800">
                    {{ invoice.customer_name }}
                </p>

                <p class="text-sm text-gray-500 mt-3">Amount</p>
                <p class="font-semibold text-gray-800">
                    {{ invoice.amount }}
                </p>
            </div>

            <form method="POST" class="flex flex-col sm:flex-row gap-3 mt-8">

                {% csrf_token %}

                <button
                    type="submit"
                    class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium px-5 py-3 rounded-lg transition"
                >
                    Yes, Delete Invoice
                </button>

                <a
                    href="{% url 'invoice_list' %}"
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-5 py-3 rounded-lg transition"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
